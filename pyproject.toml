[project]
name = "sartoria-spike"
version = "0.1.0"
description = "Does a phone video give leg measurements good enough to pick a jeans size?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.10",
    "numpy>=1.26,<2.3",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
