version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # Types follow the Node major in .nvmrc; bump both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 6.x has no macOS x86_64 wheel; see the note in pyproject.toml.
      - dependency-name: cbor2
        versions: [">=6"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
